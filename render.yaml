databases:
  - name: bookloom-db
    databaseName: booklist
    user: bookloom
    plan: free
    region: oregon

services:
  - type: web
    name: bookloom-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookloom-db
          property: connectionString
      - key: FRONTEND_ORIGIN
        value: https://book-list-b3um.onrender.com
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"

  - type: web
    name: bookloom-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://book-list-b3um.onrender.com
